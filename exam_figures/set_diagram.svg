<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300pt" height="220pt">
  <style>.figure-line { fill: none; stroke: #000; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; } .figure-thin { fill: none; stroke: #000; stroke-width: 0.8; stroke-linecap: round; } .figure-fill { fill: #000; stroke: none; } .figure-dash { fill: none; stroke: #000; stroke-width: 0.8; stroke-dasharray: 4,3; } .figure-text { fill: #000; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 9pt; text-anchor: middle; dominant-baseline: central; } .figure-text-left { fill: #000; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 9pt; text-anchor: start; } .figure-arrow { fill: #000; stroke: none; } .figure-dot { fill: #000; stroke: none; } </style>
  <circle cx="120.0" cy="100.0" r="55.0" class="figure-line"/>
  <text x="120.0" y="35.0" class="figure-text">A</text>
  <circle cx="180.0" cy="100.0" r="55.0" class="figure-line"/>
